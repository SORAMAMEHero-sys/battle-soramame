<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>マリオ風ゲーム - スマホ版第1章</title>
    <style>
        body {
            background-color: #222;
            color: white;
            text-align: center;
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
        }
        canvas {
            background-color: #5c94fc;
            display: block;
            margin: 10px auto;
            border: 3px solid #fff;
            max-width: 100%;
            height: auto;
        }
        /* スマホ用の操作ボタンエリア */
        .controls {
            margin-top: 15px;
        }
        .btn {
            background-color: #ffcc00;
            border: none;
            color: #222;
            font-size: 24px;
            padding: 15px 30px;
            margin: 0 10px;
            border-radius: 10px;
            font-weight: bold;
            touch-action: manipulation;
        }
        .btn:active {
            background-color: #ff9900;
        }
    </style>
</head>
<body>

    <h1>スマホでゲーム作り！</h1>
    <p>下のボタンを押して動かしてみよう</p>

    <!-- キャンバス -->
    <canvas id="gameCanvas" width="400" height="300"></canvas>

    <!-- スマホ用ボタン -->
    <div class="controls">
        <button class="btn" id="leftBtn">◀ 左</button>
        <button class="btn" id="rightBtn">右 ▶</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let player = {
            x: 180,
            y: 200,
            width: 30,
            height: 40,
            speed: 4,
            color: "#e52521"
        };

        // ボタンの状態を管理
        let isLeftPressed = false;
        let isRightPressed = false;

        // タップ（タッチ操作＆マウス操作両対応）
        const leftBtn = document.getElementById("leftBtn");
        const rightBtn = document.getElementById("rightBtn");

        // 左ボタン
        leftBtn.addEventListener("touchstart", () => { isLeftPressed = true; });
        leftBtn.addEventListener("touchend", () => { isLeftPressed = false; });
        leftBtn.addEventListener("mousedown", () => { isLeftPressed = true; });
        leftBtn.addEventListener("mouseup", () => { isLeftPressed = false; });

        // 右ボタン
        rightBtn.addEventListener("touchstart", () => { isRightPressed = true; });
        rightBtn.addEventListener("touchend", () => { isRightPressed = false; });
        rightBtn.addEventListener("mousedown", () => { isRightPressed = true; });
        rightBtn.addEventListener("mouseup", () => { isRightPressed = false; });

        function update() {
            if (isLeftPressed) {
                player.x -= player.speed;
            }
            if (isRightPressed) {
                player.x += player.speed;
            }

            // 画面の端で止める
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) {
                player.x = canvas.width - player.width;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 地面
            ctx.fillStyle = "#00ac00";
            ctx.fillRect(0, 240, canvas.width, 60);

            // プレイヤー
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>

</body>
</html>
