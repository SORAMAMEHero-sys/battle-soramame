<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>マリオ風ゲーム - ジャンプ編</title>
    <style>
        body {
            background-color: #222;
            color: white;
            text-align: center;
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
        }
        canvas {
            background-color: #5c94fc;
            display: block;
            margin: 10px auto;
            border: 3px solid #fff;
            max-width: 100%;
            height: auto;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .btn {
            background-color: #ffcc00;
            border: none;
            color: #222;
            font-size: 22px;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: bold;
            touch-action: manipulation;
        }
        .btn:active {
            background-color: #ff9900;
        }
    </style>
</head>
<body>

    <h1>スマホでゲーム作り！第2章</h1>
    <p>ジャンプ機能を追加したよ！</p>

    <!-- キャンバス -->
    <canvas id="gameCanvas" width="400" height="300"></canvas>

    <!-- スマホ用ボタン（左・ジャンプ・右） -->
    <div class="controls">
        <button class="btn" id="leftBtn">◀ 左</button>
        <button class="btn" id="jumpBtn">⤴ ジャンプ</button>
        <button class="btn" id="rightBtn">右 ▶</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let player = {
            x: 180,
            y: 100,
            width: 30,
            height: 40,
            speed: 4,
            velocityY: 0,    // 縦方向のスピード（重力・ジャンプ用）
            jumpPower: -10,  // ジャンプの強さ（マイナスが上方向）
            gravity: 0.5,    // 重力の強さ
            isJumping: false,
            color: "#e52521"
        };

        const groundY = 200; // 地面のY座標

        let isLeftPressed = false;
        let isRightPressed = false;

        // ボタンのイベント設定
        const leftBtn = document.getElementById("leftBtn");
        const rightBtn = document.getElementById("rightBtn");
        const jumpBtn = document.getElementById("jumpBtn");

        leftBtn.addEventListener("touchstart", () => { isLeftPressed = true; });
        leftBtn.addEventListener("touchend", () => { isLeftPressed = false; });
        leftBtn.addEventListener("mousedown", () => { isLeftPressed = true; });
        leftBtn.addEventListener("mouseup", () => { isLeftPressed = false; });

        rightBtn.addEventListener("touchstart", () => { isRightPressed = true; });
        rightBtn.addEventListener("touchend", () => { isRightPressed = false; });
        rightBtn.addEventListener("mousedown", () => { isRightPressed = true; });
        rightBtn.addEventListener("mouseup", () => { isRightPressed = false; });

        // ジャンプボタンは「押した瞬間」に反応させる
        jumpBtn.addEventListener("touchstart", (e) => {
            e.preventDefault();
            jump();
        });
        jumpBtn.addEventListener("mousedown", () => {
            jump();
        });

        function jump() {
            // 地面にいるときだけジャンプできる
            if (!player.isJumping) {
                player.velocityY = player.jumpPower;
                player.isJumping = true;
            }
        }

        function update() {
            // 左右移動
            if (isLeftPressed) player.x -= player.speed;
            if (isRightPressed) player.x += player.speed;

            // 画面の端制限
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) {
                player.x = canvas.width - player.width;
            }

            // 重力の計算
            player.velocityY += player.gravity;
            player.y += player.velocityY;

            // 地面との着地判定
            if (player.y > groundY) {
                player.y = groundY;
                player.velocityY = 0;
                player.isJumping = false;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 地面を描く
            ctx.fillStyle = "#00ac00";
            ctx.fillRect(0, groundY + player.height, canvas.width, canvas.height - (groundY + player.height));

            // プレイヤーを描く
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>

</body>
</html>
