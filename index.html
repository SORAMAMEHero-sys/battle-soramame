<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>マリオ風ゲーム - 第1章ステージ完成</title>
    <style>
        body {
            background-color: #222;
            color: white;
            text-align: center;
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
        }
        canvas {
            background-color: #5c94fc;
            display: block;
            margin: 10px auto;
            border: 3px solid #fff;
            max-width: 100%;
            height: auto;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .btn {
            background-color: #ffcc00;
            border: none;
            color: #222;
            font-size: 22px;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: bold;
            touch-action: manipulation;
        }
        .btn:active {
            background-color: #ff9900;
        }
    </style>
</head>
<body>

    <h1>スマホでゲーム作り！第1章：ステージ完成</h1>
    <p>足場を下からすり抜けて、右端の黄色いゴールを目指せ！</p>

    <!-- キャンバス -->
    <canvas id="gameCanvas" width="400" height="300"></canvas>

    <!-- スマホ用ボタン -->
    <div class="controls">
        <button class="btn" id="leftBtn">◀ 左</button>
        <button class="btn" id="jumpBtn">⤴ ジャンプ</button>
        <button class="btn" id="rightBtn">右 ▶</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // プレイヤーのデータ
        let player = {
            x: 30,
            y: 150,
            width: 25,
            height: 35,
            speed: 4,
            velocityY: 0,
            jumpPower: -9,
            gravity: 0.4,
            isJumping: false,
            color: "#e52521"
        };

        const groundY = 230; // 基本の地面の高さ

        // ステージにある「足場」のリスト（x, y, width, height）
        const blocks = [
            { x: 120, y: 160, width: 60, height: 15 }, // 1つ目の足場
            { x: 220, y: 120, width: 60, height: 15 }, // 2つ目の足場
        ];

        // ゴールのデータ（黄色いブロック）
        const goal = {
            x: 340,
            y: 180,
            width: 30,
            height: 50,
            color: "#f8d000"
        };

        let isLeftPressed = false;
        let isRightPressed = false;

        // ボタンのイベント設定
        const leftBtn = document.getElementById("leftBtn");
        const rightBtn = document.getElementById("rightBtn");
        const jumpBtn = document.getElementById("jumpBtn");

        leftBtn.addEventListener("touchstart", () => { isLeftPressed = true; });
        leftBtn.addEventListener("touchend", () => { isLeftPressed = false; });
        leftBtn.addEventListener("mousedown", () => { isLeftPressed = true; });
        leftBtn.addEventListener("mouseup", () => { isLeftPressed = false; });

        rightBtn.addEventListener("touchstart", () => { isRightPressed = true; });
        rightBtn.addEventListener("touchend", () => { isRightPressed = false; });
        rightBtn.addEventListener("mousedown", () => { isRightPressed = true; });
        rightBtn.addEventListener("mouseup", () => { isRightPressed = false; });

        jumpBtn.addEventListener("touchstart", (e) => {
            e.preventDefault();
            jump();
        });
        jumpBtn.addEventListener("mousedown", () => {
            jump();
        });

        function jump() {
            if (!player.isJumping) {
                player.velocityY = player.jumpPower;
                player.isJumping = true;
            }
        }

        function update() {
            // 左右移動
            if (isLeftPressed) player.x -= player.speed;
            if (isRightPressed) player.x += player.speed;

            // 画面の端制限
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) {
                player.x = canvas.width - player.width;
            }

            // 重力の計算
            player.velocityY += player.gravity;
            player.y += player.velocityY;

            // 基本の地面との着地判定
            if (player.y + player.height > groundY) {
                player.y = groundY - player.height;
                player.velocityY = 0;
                player.isJumping = false;
            }

            // 足場（ブロック）との判定（下からすり抜け、上から着地）
            blocks.forEach(b => {
                if (
                    player.velocityY > 0 && // 落下中のみ
                    player.x + player.width > b.x && 
                    player.x < b.x + b.width &&
                    player.y + player.height <= b.y + player.velocityY &&
                    player.y + player.height >= b.y
                ) {
                    player.y = b.y - player.height;
                    player.velocityY = 0;
                    player.isJumping = false;
                }
            });

            // ゴール判定
            if (
                player.x < goal.x + goal.width &&
                player.x + player.width > goal.x &&
                player.y < goal.y + goal.height &&
                player.y + player.height > goal.y
            ) {
                alert("🎉 第1章 クリアおめでとう！ 🎉");
                player.x = 30;
                player.y = 150;
                player.velocityY = 0;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 地面を描く
            ctx.fillStyle = "#00ac00";
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

            // 足場を描く
            ctx.fillStyle = "#c84c0c";
            blocks.forEach(b => {
                ctx.fillRect(b.x, b.y, b.width, b.height);
            });

            // ゴールを描く
            ctx.fillStyle = goal.color;
            ctx.fillRect(goal.x, goal.y, goal.width, goal.height);

            // プレイヤーを描く
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>

</body>
</html>
